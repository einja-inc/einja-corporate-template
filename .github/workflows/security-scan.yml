name: security-scan
on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_ENABLE_COMMENTS: "false"
